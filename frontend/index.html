<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes" />
    <meta name="theme-color" content="#7b3eff" />
    <meta name="color-scheme" content="light dark" />
    
    <!-- SEO Meta Tags -->
    <title>Nexa - Email Communication Reimagined | Smart Email Management Platform</title>
    <meta name="description" content="Nexa is a powerful email management platform with custom domains, team collaboration, and smart notifications. Take control of your email communication today." />
    <meta name="keywords" content="email management, custom email, team email, business email, email hosting, email platform, Nexa" />
    <meta name="author" content="Nexa" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nexa - Email Communication Reimagined" />
    <meta property="og:description" content="Powerful email management platform with custom domains, team collaboration, and smart notifications." />
    <meta property="og:image" content="/nexa-icon.png" />
    <meta property="og:image:alt" content="Nexa Email Platform" />
    <meta property="og:url" content="https://nexa.app" />
    <meta property="og:site_name" content="Nexa" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nexa - Email Communication Reimagined" />
    <meta name="twitter:description" content="Powerful email management platform with custom domains, team collaboration, and smart notifications." />
    <meta name="twitter:image" content="/nexa-icon.png" />
    
    <!-- Apple Touch Icon & Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/nexa-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/nexa-icon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/nexa-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/nexa-icon.png" />
    <link rel="shortcut icon" href="/nexa-icon.png" />
    
    <!-- Android/Chrome Icons -->
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="mask-icon" href="/nexa-icon.png" color="#7b3eff" />
    
    <!-- Preconnect to critical domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://nexa.app" />
    
    <!-- Mobile App Capabilities (PWA) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nexa" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Nexa" />
    
    <!-- Android App Links -->
    <meta name="google-play-app" content="app-id=com.curriumx.nexa" />
    
    <!-- Format Detection -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="format-detection" content="date=no" />
    <meta name="format-detection" content="address=no" />
    <meta name="format-detection" content="email=no" />
    
    <!-- Security Headers -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
